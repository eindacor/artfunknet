<template name="userGallery">
	<div class="template-userGallery">
		<div class="container">
			{{#with entryInfo screen_name}}
			{{#if paid}}
				<div class="row no-padding no-margin">
					<div class="npc-area">
						{{#each npc owner_id}}
							<i data-npc_id="{{_id}}" class="npc {{quality}} fa {{icon}} {{#if unmet _id}}enabled{{else}}disabled{{/if}}"></i>
						{{/each}}
					</div>
				</div>
				<h1 class="af-color">Player Gallery - {{screen_name}}</h1>

				<div id="gallery-wall">
					<div class="wall-wash">
						<div class="image-container">
						{{#with galleryData screen_name}}
							{{#each displayed}}
								{{> galleryItem this}}
							{{/each}}
						
							{{#each permanent}}
								{{> galleryItem this}}
							{{/each}}
						{{/with}}
						</div>
					</div>
				</div>
				<div id="gallery-floor"></div>
			
			{{else}}
				<div class="row">
					<h4>entry fee: <span class="highlight af-color">{{entry_fee_text}}</span></h4>
					<button class="{{#if pay_fee_enabled}}enabled{{else}}disabled{{/if}}" id="enter-button" data-owner_id="{{owner_id}}">pay fee</button>
				</div>
			{{/if}}
			{{/with}}
		</div>
	</div>
</template>

<template name="galleryItem">
	<div class="painting-container" data-item_id="{{this._id}}">
		<div class="item"><img src="{{#with getFilename this.artwork_id}}{{getImageURL this}}{{/with}}" style="width: {{calcWidth this.artwork_id}}px"></div>
		<div class="plackard">
			{{#with plackardData this.artwork_id}}
				<p>{{title}}</p>
				<p>{{artist}}, {{date}}</p>
				<p class="{{this.rarity}}">{{rarity}}</p>
			{{/with}}
		</div>
	</div>
</template>
