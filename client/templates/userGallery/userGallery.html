<template name="userGallery">
	<div class="template-userGallery">
		<div class="container">
			{{#with entryInfo screen_name}}
			{{#if paid}}
				<div class="row no-padding no-margin">
					<div class="npc-area">
						{{#each npc owner_id}}
							<i data-npc_id="{{_id}}" class="npc {{quality}} fa {{icon}} {{#if unmet _id}}enabled{{else}}disabled{{/if}}"></i>
						{{/each}}
					</div>
				</div>
				<h1 class="af-color">Player Gallery - {{screen_name}}</h1>

				{{#with galleryData screen_name}}
				<div class="window-crop row">
					<div class="rendered-scene">
						<div id="gallery-wall" style="background: url({{getTextureURL finish_data.wall_filename}}) repeat scroll 0% 0% / {{finish_data.wall_size}}">
							<div class="wall-wash" style="background-color: rgba({{rgbString finish_data.wall_base}}, {{finish_data.wall_wash_opacity}})">
								<div class="image-container">	
								{{#each displayed}}
									{{> galleryItem painting_info=this finish_data=../finish_data}}
								{{/each}}
							
								{{#each permanent}}
									{{> galleryItem painting_info=this finish_data=../finish_data}}
								{{/each}}		
								</div>
							</div>
						</div>
						<div id="gallery-floor" style="background: url({{getTextureURL finish_data.floor_filename}}) repeat scroll 0% 0% / {{finish_data.floor_size}}"></div>
					</div>
				</div>
				{{/with}}

				{{#if canEdit screen_name}}
					{{> galleryEdit}}
				{{/if}}
			
			{{else}}
				<div class="row">
					<h4>entry fee: <span class="highlight af-color">{{entry_fee_text}}</span></h4>
					<button class="{{#if pay_fee_enabled}}enabled{{else}}disabled{{/if}}" id="enter-button" data-owner_id="{{owner_id}}">pay fee</button>
				</div>
			{{/if}}
			{{/with}}
		</div>
	</div>
</template>

<template name="galleryItem">
	<div class="painting-container" data-item_id="{{painting_info._id}}">
		<div class="item" style="padding: {{finish_data.matte_width}}px; border: {{finish_data.frame_width}}px solid black">
			<div style="width: {{calcWidth this}}px; height: {{calcHeight this}}px; background: url({{#with getFilename painting_info.artwork_id}}{{getImageURL this}}{{/with}}); background-size: 100% auto">
				{{#if shimmer this}}<div class="foil" style="width: {{calcWidth this}}px; height: {{calcHeight this}}px"></div>{{/if}}
			</div>
		</div>
		{{#with plackardData this}}
		<div class="plackard" style="width: {{width}}px; height: {{height}}px; font-size: {{text_height}}px">
			<p>{{artwork_data.title}}</p>
			<p>{{artwork_data.artist}}, {{artwork_data.date}}</p>
			<p class="{{artwork_data.rarity}}">{{artwork_data.rarity}}</p>
		</div>
		{{/with}}
	</div>
</template>

<template name="galleryEdit">
	<div class="galleryEdit">
		<div class="row edit-area">
			<div class="col-xs-6 finish-section">
				<div class="col-xs-12">
					<h3>Wall Finishes</h3>
					<div class="row">
						{{#each wall_finish}}
							<img data-gallery_finish_id="{{finish_id}}" class="wall-finish-thumbnail" src="{{getTextureURL filename}}">
						{{/each}}
					</div>
					<div class="row">
						<p>wall pattern opacity</p>
						<div class="col-xs-6" id="opacity-slider"></div>
					</div>
					<div class="row">
						<p>frame width</p>
						<div class="col-xs-6" id="frame-slider"></div>
					</div>
					<div class="row">
						<p>matte width</p>
						<div class="col-xs-6" id="matte-slider"></div>
					</div>
					<div class="row">
						<p>wall base</p>
						<select id="wall-base-selector">
							<option value="white">white</option>
							<option value="black">black</option>
							<option value="red">red</option>
							<option value="green">green</option>
							<option value="blue">blue</option>
						</select>
					</div>
				</div>
			</div>
			<div class="col-xs-6 finish-section">
			<h3>Floor Finishes</h3>
			{{#each floor_finish}}
				<img data-gallery_finish_id="{{finish_id}}" class="floor-finish-thumbnail" src="{{getTextureURL filename}}">
			{{/each}}
			</div>
		</div>
	</div>
</template>
