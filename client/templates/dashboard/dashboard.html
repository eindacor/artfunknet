<template name="dashboard">
	<div class="template-dashboard">
		<div class="container">
			{{#with userData}}
			<div class="row no-padding no-margin">
				<div class="row">
					<span class="gamertag af-color">{{screen_name}}</span>{{#if vintage_count}} ({{vintage_count}}){{/if}}
				</div>
				<div class="dashboard-tab-area">
					{{> dashboardTab current_section=current_section section_title="home" icon="home"}}
					{{> dashboardTab current_section=current_section section_title="inventory" icon="archive"}}
					{{> dashboardTab current_section=current_section section_title="loot" icon="gift"}}
					{{> dashboardTab current_section=current_section section_title="gallery" icon="picture-o"}}
					{{> dashboardTab current_section=current_section section_title="checklist" icon="list"}}
					{{> dashboardTab current_section=current_section section_title="quests" icon="flag-checkered"}}
					{{> dashboardTab current_section=current_section section_title="myAuctions" icon="bullhorn"}}
					{{> dashboardTab current_section=current_section section_title="settings" icon="wrench"}}
				</div>
				<div class="row no-padding no-margin dash-templates">
					{{#if isEqual current_section "home"}}
						{{> info userData=userData}}
					{{/if}}
					{{#if isEqual current_section "inventory"}}
						{{> inventory}}
					{{/if}}
					{{#if isEqual current_section "loot"}}
						{{> randomDrop}}
					{{/if}}
					{{#if isEqual current_section "checklist"}}
						{{> checklist}}
					{{/if}}
					{{#if isEqual current_section "quests"}}
						{{> quests}}
					{{/if}}
					{{#if isEqual current_section "gallery"}}
						{{> userGallery screen_name=screen_name own_gallery=true}}
					{{/if}}
					{{#if isEqual current_section "myAuctions"}}
						{{> myAuctions}}
					{{/if}}
				</div>
			</div>
			{{/with}}
		</div>
	</div>
</template>

<template name="dashboardTab">
	<dev class="dash-tab" data-section_name="{{section_title}}">	
		<dev class="title-wrapper {{#if isEqual current_section section_title}}current{{/if}}">				
			<span class="{{#if isEqual current_section section_title}}af-color current{{else}}black-text{{/if}}">{{section_title}}</span>
		</dev>
	</dev>
</template>

<template name="dashboardTab2">
	<dev class="dash-tab" data-section_name="{{section_title}}">	
		<dev class="icon-wrapper {{#if isEqual current_section section_title}}current{{/if}}">				
			<i class="dash-icon fa fa-{{icon}} {{#if isEqual current_section section_title}}af-color current{{/if}}"></i>
		</dev>
		<dev class="title-wrapper">				
			<p class="black-text">{{section_title}}</p>
		</dev>
	</dev>
</template>

<template name="info">
	{{#with userData}}
	<div class="row">
		<div class="col-xs-6 no-padding">
			{{#if max_level}}
			<div class="row">
				<div class="xp-bar">
					{{#with xpData}}
					<div class="xp-level max" style= "width : {{xp_completion}}%"></div>
					<div class="level-text">
						<p>lottery tickets: {{tickets}}</p>
					</div>
					<div class="goal-text">
						<p class="highlight">{{current_xp}} / {{xp_goal}}</p>
					</div>
					{{/with}}
				</div>
			</div>
			<div class="row"><button id="vintage-mode" class="vintage-button">vintage <i class="fa fa-backward"></i></button></div>
			{{else}}
			<div class="xp-bar">
				{{#with xpData}}
				<div class="xp-level" style= "width : {{xp_completion}}%"></div>
				<div class="level-text">
					<p>level {{current_level}}</p>
				</div>
				<div class="goal-text">
					<p class="highlight">{{current_xp}} / {{xp_goal}}</p>
				</div>
				{{/with}}
			</div>
			{{/if}}
		</div>
	</div>
	<div class="row player-info">
		<div class="col-xs-12">
			<p class="player-data">bank balance: <span class="highlight af-color">${{bank_balance}}</span></p>	
			<p class="player-data">collection value: <span class="highlight af-color">${{collection_value}}</span></p>				
			<p class="player-data">current exhibition value: <span class="highlight af-color">${{display_value}}</span></p>					
			<p class="player-data">items exhibited: <span class="highlight af-color">{{display_count}}</span> ({{display_max}} max)</p>					
			<p class="player-data">paintings owned: <span class="highlight af-color">{{inventory_count}}</span></p>
			<p class="player-data">inventory space available: <span class="highlight af-color">{{slots_available}}</span></p>	
			<p class="player-data">originals owned: <span class="highlight purple-text">{{original_count}}</span></p>	
			<p class="player-data">vintage items owned: <span class="highlight vintage-text">{{vintage_items}}</span></p>									
			<p class="player-data">permanent collection: <span class="highlight af-color">{{private_count}}</span> ({{private_max}} max)</p>		
			<p class="player-data">completed quests: <span class="highlight af-color">{{completed_quests}}</span></p>	
			<p class="player-data">auctioned items: <span class="highlight af-color">{{auctioned_items}}</span> ({{auction_cap}} max)</p>
			<p class="player-data">winning auctions: <span class="highlight af-color">{{winning_auctions}}</span> ({{auction_cap}} max)</p>		
			<p class="player-data">gallery entry fee: 
				<select class="price-selector">
					<option selected="selected" value="{{entry_fee}}">{{entry_fee}}</option>
					{{#each unselected entry_fee}}
						<option value="{{this}}">{{this}}</option>
					{{/each}}
				</select>
			</p>
    	</div>
	</div>		
	<div class="row ticket-info">
	{{#each ticket}}
		{{#with ticketData this}}
		<a href="/user/{{owner_name}}" class="ticket-button {{#if unmet_npcs}}af-color{{else}}npcs-met{{/if}}"><i data-expiration_string="{{expiration_string}}" data-owner_name="{{owner_name}}" class="fa fa-ticket"></i></a>
		{{/with}}
	{{/each}}
		<p>ticket limit: {{ticket_max}}</p>
	</div>

	<div class="alert-area">
	{{#if alert_count}}
		{{> alerts}}
	{{/if}}
	</div>
	{{/with}}
</template>

<template name="settings">

</template>

<template name="myAuctions">
	<div class="row dash-section">
		<div class="col-xs-2">
			<button id="toggle-details" type="button" class="btn btn-default">toggle details</button>
		</div>
		<div class="col-xs-2 col-xs-offset-8">
			<i id="refresh-auctions" class="blue-text fa fa-refresh"></i>
		</div>
		{{refreshAuctions}}
		<div class="col-xs-12">
			<h3>watched auctions</h3>
			<div class="col-xs-12">		
				{{>auctionTable auction_data=watchedAuctionData hide_ui=true}}
			</div>
		</div>

		<div class="col-xs-12">
			<h3>your auctions</h3>
			<div class="col-xs-12">		
				{{>auctionTable auction_data=playerAuctionData hide_ui=true}}
			</div>
		</div>
	</div>
</template>
