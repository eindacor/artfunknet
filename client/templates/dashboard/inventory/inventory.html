<template name="inventory">
	<div class="template-inventory">
		<h1>Inventory</h1>
		<div class="row inventory-management no-padding">
			<h3 class="view-buttons"><i id="toggle-view" class="fa fa-list {{#if list_view}}af-color{{/if}}"></i><i id="toggle-filters" class="fa fa-filter"></i></h3>
			<div class="row all-filters">
				<textarea id="tag-selector" placeholder="search by tags (separate tags with a comma, e.g. 'primary, to auction, foils')"></textarea>
				<div class="sort-area col-xs-12 col-md-4">
					<p class="filter-title">sort:</p>
					<select id="sort-selector">
						<option value="artwork_data.title">title</option>
						<option value="artwork_data.date">date</option>
						<option value="artwork_data.artist">artist</option>
						<option value="artwork_data.rarity_value">rarity</option>
						<option value="condition">condition</option>
						<option value="xp_rating">xp_rating</option>
					</select>
					<select id="order-selector">
						<option value="1">ascending</option>
						<option value="-1">descending</option>
					</select>
				</div>

				<div class="filter-area col-xs-12 col-md-8">
					<div class="row">
						<div class="col-xs-3">
							<p class="filter-title">card type:</p>
							<div class="filter-checkboxes">
								<label><input class="type-select" type="checkbox" id="card-type-checkbox" value="standard" checked>standard</label><br>
								<label><input class="type-select" type="checkbox" id="card-type-checkbox" value="foil" checked>foil</label><br>
								<label><input class="type-select" type="checkbox" id="card-type-checkbox" value="seasonal" checked>seasonal</label><br>
								<label><input class="type-select" type="checkbox" id="card-type-checkbox" value="lottery" checked>lottery</label><br>
								<label><input class="type-select" type="checkbox" id="card-type-checkbox" value="original" checked>original</label>
							</div>
						</div>

						<div class="col-xs-3">
							<p class="filter-title">status:</p>
							<div class="filter-checkboxes">
								<label><input class="status-select" type="checkbox" id="card-status-checkbox" value="claimed" checked>inventory</label><br>
								<label><input class="status-select" type="checkbox" id="card-status-checkbox" value="permanent" checked>permanent collection</label><br>
								<label><input class="status-select" type="checkbox" id="card-status-checkbox" value="displayed" checked>on display</label><br>
								<label><input class="status-select" type="checkbox" id="card-status-checkbox" value="auctioned" checked>auctioned</label>
							</div>
						</div>

						<div class="col-xs-3">
							<p class="filter-title">rarity:</p>
							<div class="filter-checkboxes">
								<label><input class="rarity-select" type="checkbox" id="card-rarity-checkbox" value="common" checked>common</label><br>
								<label><input class="rarity-select" type="checkbox" id="card-rarity-checkbox" value="uncommon" checked>uncommon</label><br>
								<label><input class="rarity-select" type="checkbox" id="card-rarity-checkbox" value="rare" checked>rare</label><br>
								<label><input class="rarity-select" type="checkbox" id="card-rarity-checkbox" value="legendary" checked>legendary</label><br>
								<label><input class="rarity-select" type="checkbox" id="card-rarity-checkbox" value="masterpiece" checked>masterpiece</label>
							</div>
						</div>

						{{#if showLockedAttributes}}
						<div class="col-xs-3">
							<p class="filter-title">locked attributes:</p>
							<div class="filter-checkboxes">
								{{#each locked_attribute}}
								<label><input class="locked-attribute-select" type="checkbox" id="locked-attribute-checkbox" value="{{_id}}">{{attributeName _id}}</label><br>
								{{/each}}
							</div>
						</div>
						{{/if}}
						
					</div>
				</div>
			</div>
		</div>

		<div class="row">
			{{#if list_view}}
			<table class="inventory-table" data-table_id="{{this.table_id}}">
				{{#each owned}}
				<tr data-item_id="{{_id}}">
					<td>
						{{#with thumbnailInfo _id}}
						<img class="image-thumb preview enabled" src="{{getThumbImageURL filename}}"/>
						{{/with}}
					</td>
					<td>{{artwork_data.title}}</td>
					<td>{{artwork_data.date}}</td>
					<td>{{artwork_data.artist}}</td>
					<td><span class="{{artwork_data.rarity}}"><strong>{{artwork_data.rarity}}</strong></span>{{#if foil}}<span class="af-color"> foil</span>{{/if}}{{#if seasonal}}<span class="common"> seasonal</span>{{/if}}{{#if lottery}}<span class="gold"> lottery {{lottery}}</span>{{/if}}{{#if original}}<span class="purple-text"> original</span>{{/if}}</td>
					<td>${{getItemValue _id "actual"}}</td>
					<td>{{artwork_data.height}} x {{artwork_data.width}}</td>
					<td style="color: rgb({{valueColor condition}}, 0, 0)" >%{{floatToPercentage condition}}</td>
					<td>
					{{#each attributes}}
						<i data-attribute_title="{{this.description}}" data-attribute_value="{{this.value}}" style="color: rgb({{valueColor this.value}}, 0, 0)" class="list-item-attribute fa {{this.icon}}"></i>
					{{/each}}
					</td>
					<td style="color: rgb({{valueColor xp_rating}}, 0, 0)" >{{floatToPercentage xp_rating}}</td>
					<td>{{roll_count}}</td>
					<td class="action-buttons no-padding">						
						{{#if isEqual status "displayed"}}
							<span class="remaining-text">on display - {{display_time_remaining this}}</span>
						{{else}}

							{{#if isEqual status "auctioned"}}
								<span class="remaining-text">auctioned - {{auction_time_remaining this}}</span>
							{{else}}
								{{#with itemPermissions this}}
									<span class="quick-sell {{#if sell}}enabled{{else}}disabled{{/if}}"><i data-item_id="{{../_id}}" class="fa fa-usd"></i></span>	
									<span class="auction {{#if auction}}enabled{{else}}disabled{{/if}}"><i data-item_id="{{../_id}}" class="fa fa-gavel"></i></span>			
									<span class="display {{#if display}}enabled{{else}}disabled{{/if}}"><i data-item_id="{{../_id}}" class="fa fa-picture-o"></i></span>	
									<span class="reroll {{#if reroll}}enabled{{else}}disabled{{/if}}"><i data-item_id="{{../_id}}" class="fa fa-magic"></i></span>		
									<span class="perm-collection {{#if permanent}}{{#if isEqual ../status 'permanent'}}active af-color{{else}}inactive{{/if}}{{else}}disabled{{/if}}"><i data-item_id="{{_id}}" class="fa fa-heart"></i></span>
								{{/with}}
							{{/if}}

						{{/if}}
						<span class="tags enabled"><i data-item_id="{{_id}}" class="fa fa-tags"></i></span>		
					</td>
				</tr>
				{{/each}}
			</table>
			{{else}}

			{{#each owned}}
				{{>itemInfo item_data=this sell_button=true auction_button=true display_button=true reroll_button=true permanent_button=true tag_button=true}}
			{{/each}}

			{{/if}}
		</div>
	</div>
</template>

<template name="inventoryHeaderTemplate">
	<th class="table-header" data-sort="{{sort_id}}" data-table_id="{{table_id}}">
		<div class="row no-margin">
			<div class="col-xs-12">
				<p>{{text}}</p>
			</div>
		</div>
	</th>
</template>
