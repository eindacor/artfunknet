<template name="store">
	<div class="template-store container">
		<h1 class="af-color">Store</h1>
		<h4>bank balance: <span class="af-color">${{bank_balance}}</span></h4>
		<div class="crate-buttons">
			{{#with dropButton}}
			<button class="crate-button {{#if enabled}}enabled{{else}}disabled{{/if}}">purchase crate - {{crateCost}}</button>
			{{/with}}
			{{#if has_for_sale}}
			<button id="decline-all">decline all</button>
			{{/if}}
		</div>

		{{#if full}}
		<p>Note: your inventory is currently full. You will be unable to add new artwork to your inventory</p>
		{{/if}}

		{{#each for_sale}}
			<div class="store-item-container">
				{{>itemInfo item_data=this purchase_button=true decline_button=true}}
				<p class="price-text">cost - ${{getItemValue this._id "dealer"}}</p>
			</div>
		{{/each}}

		<div class="col-xs-6 finish-section">
			<h3>Wall Finishes</h3>
			<div class="row">
				{{#each wall_finish}}
				<div class="wall-finish-container" data-gallery_finish_id="{{_id}}" data-gallery_finish_filename="{{filename}}">
					<img class="wall-finish-thumbnail" src="{{getTextureURL filename}}">
					<div data-gallery_finish_id="{{_id}}" id="purchase-finish">
						<p>purchase</p>
					</div>
				</div>
				
				{{/each}}
			</div>
		</div>
		<div class="col-xs-6 finish-section">
			<h3>Floor Finishes</h3>
			<div class="row">
				{{#each floor_finish}}
				<div class="floor-finish-container" data-gallery_finish_id="{{_id}}" data-gallery_finish_filename="{{filename}}">
					<img class="floor-finish-thumbnail" src="{{getTextureURL filename}}">
				</div>
				<button data-gallery_finish_id="{{_id}}" id="purchase-finish">purchase</button>
				{{/each}}
			</div>
		</div>

	</div>
</template>

<template name="forSaleInfo">
	<div class="template-forSaleInfo">
		<div class="col-xs-12 no-margin">
			<div class="info-area">
				{{#with itemData this}}

				<h4 class="{{rarity}}">{{title}}</h4>
				<p>{{artist}}, {{date}}</p>
				<p><span class="{{rarity}}"><strong>{{rarity}}</strong></span></p>
				<p>{{medium}}</p>
				<p>{{height}} x {{width}}</p>
				<p>condition: <span style="color: {{getHTMLColorFromValue condition}}">{{condition_text}}</span></p>
				<p>xp rating: <span style="color: {{getHTMLColorFromValue xp_rating}}">{{xp_rating_text}}</span></p>
				<p class="item-attributes">
				{{#each attribute}}
					<i data-attribute_description="{{this.description}}" data-attribute_value="{{this.value}}" style="color: {{getHTMLColorFromValue this.value}}" class="item-attribute fa {{this.icon}}"></i>
				{{/each}}
				</p>
				{{/with}}	
			</div>		
		</div>
	</div>
</template>
