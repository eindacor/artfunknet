<template name="itemInfo">
	<div class="template-itemInfo">
		{{#if isEqual item_data.status "for_sale"}}
		<div class="item-price green-text text-shadow">
			{{displayAsMoneyValue item_data.values.dealer}}
		</div>
		{{/if}}
		<div data-item_id="{{item_data._id}}" class="card-container {{#if item_data.displaced}}displaced{{else}}{{item_data.artwork_data.rarity}}{{/if}}-item" style="background: url('{{getCardImageURL item_data.artwork_data.filename item_data.artwork_data.file_extension}}') center; background-size: {{#if isEqual item_data.artwork_data.file_extension 'gif'}}700px{{else}}280px{{/if}} 390px">
			<div class="status-mask {{#if displayedStatus item_data}}{{else}}hide{{/if}}">
				<div class="mask-info-container">
					<p><i class="text-shadow fa fa-picture-o"></i></p>
					{{#with display_details item_data}}
					{{#if earnings_per_hour}}
						<p class="display-details">{{time_since_displayed}}</p>
						<p class="display-details green-text text-shadow">{{displayAsMoneyValue earnings_per_hour}}/hr.</p>
						<p class="display-details af-color text-shadow">{{commaSeparatedValue xp_per_hour}}xp/hr.</p>
					{{/if}}
					{{/with}}
				</div>
			</div>
			<div class="status-mask {{#if auctionedStatus item_data}}{{else}}hide{{/if}}">
				<i class="text-shadow fa fa-gavel"></i>
			</div>
			<div class="status-mask {{#if repairingStatus item_data}}{{else}}hide{{/if}}">
				<div class="mask-info-container">
					<p><i class="text-shadow fa fa-wrench {{#if isEqual item_data.condition 1}}green-text{{/if}}"></i></p>
					<p class="display-details text-shadow {{#if isEqual item_data.condition 1}}green-text{{/if}}">{{floatToPercentage item_data.condition}}%</p>
				</div>
			</div>
			<div class="status-mask {{#if item_data.permanent}}{{#if repairingStatus item_data}}hide{{/if}}{{#if auctionedStatus item_data}}hide{{/if}}{{else}}hide{{/if}}">
				<div class="mask-info-container">
					<p><i class="text-shadow fa fa-heart"></i></p>
				</div>
			</div>
			<div class="row no-margin card-info">
				<div class="card-header col-xs-12 {{card_types item_data}}">
					<div class="row no-margin">
						<div class="header-basic-info">
							<p class="item-title work-title">{{item_data.artwork_data.title}}{{#if item_data.already_owned}} <span class="green-text">*</span>{{/if}}</p>
							<p>{{item_data.artwork_data.artist}}</p>
						</div>
					</div>

					<div class="row no-margin">
						<div class="header-details">
							<p>{{item_data.artwork_data.date}}</p>
							{{> itemSignature item_data=item_data}}
							<p>{{item_data.artwork_data.medium}}</p>
							<p>{{item_data.artwork_data.height}} x {{item_data.artwork_data.width}}</p>
							{{#if showDetails item_data}}
							{{#if item_data.odds}}
							<p>drop chance: {{item_data.odds}}</p>
							{{/if}}
							<div class="dynamic-stats">
								<p>condition: <span style="color: {{getHTMLColorFromValue item_data.condition}}">%{{floatToPercentage item_data.condition}}</span></p>
								<p id="dynamic-value-stat">estimated value: {{displayAsMoneyValue item_data.values.actual}}</p>
								{{#if item_data.market_value}}
									<p id="dynamic-value-stat">market value: {{displayAsMoneyValue item_data.market_value}}</p>
								{{/if}}
								<p id="dynamic-roll-count-stat">roll count: {{item_data.roll_count}}</p>
								{{#if item_data.authenticity.identified}}
									{{#if item_data.authenticity.forgery}}
										<p id="verified-text" class="red-text"><i class="fa fa-ban"></i> forgery</p>
										<p>heat level: {{#with fetchServerData "getForgeryHeat" item_data}}<span style="color: {{forgery_heat_color this}}">{{heat_label this}}</span>{{/with}}</p>
									{{else}}
										<p id="verified-text" class="green-text"><i class="fa fa-check"></i> verified</p>
									{{/if}}
								{{else}}
									<p id="verified-text"><i class="fa fa-question-circle-o"></i> unverified</p>
								{{/if}}
							</div>
							{{else}}
								<p>condition: ?</p>
								<p>estimated value: ?</p>
								<p>roll count: ?</p>
							{{/if}}
							<div class="flavor-area">
							{{#with unique_attribute_data item_data.active_unique_attribute}}
								<p class="flavor-text af-color {{#if ../item_data.permanent}}permanent{{/if}}">"{{flavor_text}}"</p>
							{{/with}}
							</div>
						</div>
					</div>
					
					<div class="row no-margin indicator-area">
						{{#if item_data.recommended_status.recommended}}
							{{#if item_data.recommended_status.upgrade}}
								<i class="green-text fa fa-level-up text-shadow"></i>
							{{else}}
								<i class="green-text fa fa-archive text-shadow"></i>
							{{/if}}
						{{/if}}
						{{#if item_data.quest_target}}
							<i class="green-text fa fa-flag-checkered text-shadow"></i>
						{{/if}}
						{{#if item_data.sought}}
							<i class="blue-text fa fa-bullhorn text-shadow"></i>
						{{/if}}
						{{#if item_data.authenticity.forgery}}
							<i class="red-text fa fa-user-secret text-shadow"></i>
						{{/if}}
					</div>			
				</div>

				<div class="card-footer col-xs-12 {{card_types item_data}}">
					<div class="row no-margin">
						{{#if item_data.archive_indicators}}
							<div class="archive-indicators">
							{{#each item_data.archive_indicators}}
								<i class="check {{this}}-text fa fa-archive"></i>
							{{/each}}
							</div>
						{{/if}}
						<div class="footer-basic-info">
							<div class="col-xs-8 no-padding attribute-area">
								{{#each sortedAttributes item_data.attributes.unlocked}}
									<div class="tooltip-container">
										<div class="tooltip-contents above">
											<p><span class="af-color">{{npc_name}}</span> attraction rating: <span style="color: {{getHTMLColorFromValue value}}">{{floatToPercentage value}}</span></p>
										</div>
										<i data-attribute_description="{{description}}" data-attribute_value="{{value}}" style="color: {{getHTMLColorFromValue value}}" class="{{#if ../item_data.permanent}}permanent{{/if}} item-attribute fa {{icon}}"></i>
									</div>
								{{/each}}
								{{#if item_data.attributes.locked}}<span class="separator">|</span>{{/if}}
								{{#each sortedAttributes item_data.attributes.locked}}
									<div class="tooltip-container">
										<div class="tooltip-contents above">
											<p><span class="af-color">{{npc_name}}</span> attraction rating: <span style="color: {{getHTMLColorFromValue value}}">{{floatToPercentage value}}</span></p>
										</div>
										<i data-attribute_description="{{description}}" data-attribute_value="{{value}}" style="color: {{getHTMLColorFromValue value}}" class="{{#if ../item_data.permanent}}permanent{{/if}} locked item-attribute fa {{icon}}"></i>
									</div>
								{{/each}}
								{{#if item_data.attributes.special}}<span class="separator">|</span>{{/if}}
								{{#each sortedAttributes item_data.attributes.special}}
									<div class="tooltip-container">
										<div class="tooltip-contents above">
											<p><span class="af-color">{{npc_name}}</span> attraction rating: <span style="color: {{getHTMLColorFromValue value}}">{{floatToPercentage value}}</span></p>
										</div>
										<i data-attribute_description="{{description}}" data-attribute_value="{{value}}" style="color: {{getHTMLColorFromValue value}}" class="{{#if ../item_data.permanent}}permanent{{/if}} special item-attribute fa {{icon}}"></i>
									</div>
								{{/each}}
							</div>
							<div class="col-xs-4 no-padding">
								{{#if showDetails item_data}}
								<div class="level-area">
									<p>lvl {{item_data.level}} {{#if isEqual item_data.status "archived"}}{{else}}{{#if canAffordUpgrade item_data}}<span class="af-color"><i data-item_id="{{item_data._id}}" class="level-indicator fa fa-arrow-circle-o-up"></i></span>{{/if}}{{/if}}</p>
								</div>
								{{else}}
									<p>?</p>
								{{/if}}
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		{{#if hide_actions}}
		{{else}}
		<div class="button-area below-item">
			<p class="button-row {{#if isEqual item_data.status 'archived'}}{{else}}unarchived{{/if}}">
			{{#each item_data.item_actions}}
				<div class="tooltip-container">
					<div class="tooltip-contents above">
						<p>{{tooltip}}</p>
					</div>
					<i class="action-icon fa {{action_icon action_name}}" data-action_name="{{action_name}}" data-item_id="{{../item_data._id}}" data-can_quick_discard="{{../item_data.can_quick_discard}}"></i>
				</div>
			{{/each}}
			</p>
			<p class="button-row">
			{{#each item_data.item_modifiers}}
				<div class="tooltip-container">
					<div class="tooltip-contents above">
						<p>{{tooltip}}</p>
					</div>
					<i class="action-icon fa {{action_icon action_name}}" data-action_name="{{action_name}}" data-item_id="{{../item_data._id}}" data-can_quick_discard="{{../item_data.can_quick_discard}}"></i>
				</div>
			{{/each}}
			<div class="tooltip-container">
					<div class="tooltip-contents above">
						<p>click to copy:</p>
						<textarea readonly class="link-area" id="link_{{item_data._id}}">https://artfunkelgame.com/item/{{item_data._id}}</textarea>
					</div>
					<i class="share-button fa fa-share-alt" data-item_id="{{item_data._id}}"></i>
				</div>
			</p>
		</div>
		{{/if}}
		{{#if item_select}}
			<div class="select-area below-item">
				{{#if item_is_selected selection_category item_data._id}}
					<i class="fa fa-check-square-o green-text select-box" data-item_id="{{item_data._id}}" data-selection_category="{{selection_category}}"></i>
				{{else}}
					<i class="fa fa-square-o select-box {{#if can_select}}{{else}}unavailable{{/if}}" data-item_id="{{item_data._id}}" data-selection_category="{{selection_category}}"></i>
				{{/if}}
			</div>
		{{/if}}
	</div>
</template>
