<template name="leaderboard">
	<div class="template-leaderboard">
		<div class="container">
			<h1 class="af-color">Leaderboard</h1>
			{{#with leaderboard_data}}
				{{> mvp mvp_data}}
				{{> galleryScore gallery_score_data}}
				{{> galleryValue gallery_value_data}}
				{{> archiveValue archive_data.value_data}}
				{{> archiveCount archive_data.count_data}}
				{{> earningsPerHour gallery_earnings_data}}
				{{> questsCompleted quests_completed_data}}
				{{> moneySpentOnCrates money_spent_crates_data}}
			{{/with}}
		</div>
	</div>
</template>

<template name="mvp">
	<div class="row list-mvp">
		<div class="template-galleryScore col-xs-12">
			<h3 class="af-color">Most Valuable Items</h3>
			{{#each this}}
			<div class="row list-row mvp-row" data-item_id="{{_id}}">
				<div class="col-xs-1">
					<p>{{positionFromIndex @index}}.</p>
				</div> 
				<div class="col-xs-2">
					<p class="highlight">{{owner_name _id}}</p>
				</div> 
				<div class="col-xs-4">
					<p><span class="highlight work-title">{{artwork_data.title}}</span> by <span class="highlight">{{artwork_data.artist}}</span></p>
				</div> 
				<div class="col-xs-2">
					<p class="highlight">{{displayAsMoneyValue values.actual}}</p>
				</div> 
				<div class="col-xs-2">
					{{> itemSignature item_data=this}}
				</div> 
			</div>
			{{/each}}
		</div>
	</div>
</template>

<template name="galleryScore">
	<div class="row list-section">
		<div class="template-galleryScore col-xs-12 col-md-6">
			<h3 class="af-color">Gallery Score</h3>
			{{#each this}}
				{{#if this.score}}
				<div class="row list-row">
					<div class="col-xs-1">
						<p>{{positionFromIndex @index}}.</p>
					</div> 
					<div class="col-xs-6">
						<p class="highlight">{{this.owner}}</p>
					</div> 
					<div class="col-xs-5">
						<p class="highlight">{{commaSeparatedValue this.score}}</p>
					</div> 
				</div>
				{{/if}}
			{{/each}}
		</div>
	</div>
</template>

</template>
