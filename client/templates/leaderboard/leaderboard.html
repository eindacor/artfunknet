<template name="leaderboard">
	<div class="template-leaderboard">
		<div class="container">
			<h1 class="af-color">Leaderboard</h1>
			{{#with leaderboard_data}}
				{{> mvp mvp_data}}
				{{> galleryScore gallery_score_data}}
				{{> galleryValue gallery_value_data}}
			{{/with}}
		</div>
	</div>
</template>

<template name="mvp">
	<div class="row list-mvp">
		<div class="template-galleryScore col-xs-12">
			<h3 class="af-color">Most Valuable Items</h3>
			{{#each this}}
			<div class="row list-row mvp-row" data-item_id="{{this.item_id}}">
				<div class="col-xs-1">
					<p>{{positionFromIndex @index}}.</p>
				</div> 
				<div class="col-xs-2">
					<p class="highlight">{{this.owner}}</p>
				</div> 
				<div class="col-xs-4">
					<p><span class="highlight">{{this.title}}</span> by <span class="highlight">{{this.artist}}</span></p>
				</div> 
				<div class="col-xs-2">
					<p class="highlight">{{displayAsMoneyValue this.value}}</p>
				</div> 
				<div class="col-xs-2">
					<p class="{{this.rarity}}">{{this.rarity}}{{#if this.foil}}<span class="af-color"> foil</span>{{/if}}{{#if this.seasonal}}<span class="common"> seasonal</span>{{/if}}{{#if this.original}}<span class="purple-text"> original</span>{{/if}}{{#if this.lottery}}<span class="gold"> lottery {{this.lottery}}</span>{{/if}}</p>
				</div> 
			</div>
			{{/each}}
		</div>
	</div>
</template>

<template name="galleryScore">
	<div class="row list-section">
		<div class="template-galleryScore col-xs-12 col-md-6">
			<h3 class="af-color">Gallery Score</h3>
			{{#each this}}
				{{#if this.score}}
				<div class="row list-row">
					<div class="col-xs-1">
						<p>{{positionFromIndex @index}}.</p>
					</div> 
					<div class="col-xs-6">
						<p class="highlight">{{this.owner}}</p>
					</div> 
					<div class="col-xs-5">
						<p class="highlight">{{commaSeparatedValue this.score}}</p>
					</div> 
				</div>
				{{/if}}
			{{/each}}
		</div>
	</div>
</template>

<template name="galleryValue">
	<div class="row list-section">
		<div class="template-galleryValue col-xs-12 col-md-6">
			<h3 class="af-color">Gallery Value</h3>
			{{#each this}}
				{{#if this.value}}
				<div class="row list-row">
					<div class="col-xs-1">
						<p>{{positionFromIndex @index}}.</p>
					</div> 
					<div class="col-xs-6">
						<p class="highlight">{{this.owner}}</p>
					</div> 
					<div class="col-xs-5">
						<p class="highlight">{{displayAsMoneyValue this.value}}</p>
					</div> 
				</div>
				{{/if}}
			{{/each}}
		</div>
	</div>
</template>
