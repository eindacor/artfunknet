<template name="itemActions">
	<div class="template-itemActions">
		{{#if isEqual item_data.status "archived"}}
			<div class="button-area">
				<p class="button-row archived">
					<span class="tags enabled"><i data-item_id="{{item_data._id}}" class="fa fa-tags"></i></span>
				</p>
			</div>
		{{else}}
			<div class="button-area">
				{{#with itemPermissions item_data}}
				<p class="button-row unarchived">
					{{#if claim}}
						<span class="claim enabled"><i data-item_id="{{../item_data._id}}" class="fa fa-plus"></i></span>		
					{{/if}}
					{{#if sell}}
						<span class="quick-sell enabled"><i data-item_id="{{../item_data._id}}" class="fa fa-usd"></i></span>
					{{/if}}	
					{{#if auction}}
						<span class="auction enabled"><i data-item_id="{{../item_data._id}}" class="fa fa-gavel"></i></span>
					{{/if}}	
					{{#if purchase}}
						<span class="purchase enabled"><i data-item_id="{{../item_data._id}}" class="fa fa-shopping-cart"></i></span>		
					{{/if}}	
					{{#if donate}}
						<span class="donate enabled"><i data-item_id="{{../item_data._id}}" class="fa fa-share-square"></i></span>		
					{{/if}}	
					<span class="reroll enabled"><i data-item_id="{{../item_data._id}}" class="fa fa-magic"></i></span>
					{{#if decline}}
						<span class="decline enabled"><i data-item_id="{{../item_data._id}}" class="fa fa-times"></i></span>		
					{{/if}}	
					{{#if archive}}
						<span class="archive enabled"><i data-item_id="{{../item_data._id}}" class="fa fa-archive"></i></span>		
					{{/if}}	
				</p>
				<p class="button-row">
					{{#if display}}				
						<span class="display inactive"><i data-item_id="{{../item_data._id}}" class="fa fa-picture-o"></i></span>	
					{{/if}}	
					{{#if undisplay}}	
						<span class="display active af-color"><i data-item_id="{{../item_data._id}}" class="fa fa-picture-o"></i></span>
					{{/if}}	
					{{#if permanent}}
						<span class="perm-collection inactive"><i data-item_id="{{../item_data._id}}" class="fa fa-heart"></i></span>
					{{/if}}
					{{#if unpermanent}}
						<span class="perm-collection active af-color"><i data-item_id="{{../item_data._id}}" class="fa fa-heart"></i></span>
					{{/if}}
					{{#if tag_for_sale}}
						<span class="tag-for-sale inactive"><i data-item_id="{{../item_data._id}}" class="fa fa-binoculars"></i></span>
					{{/if}}
					{{#if untag_for_sale}}
						<span class="tag-for-sale active af-color"><i data-item_id="{{../item_data._id}}" class="fa fa-binoculars"></i></span>
					{{/if}}	
					{{#if repairing}}
						<span class="repairing inactive"><i data-item_id="{{../item_data._id}}" class="fa fa-wrench"></i></span>
					{{/if}}
					{{#if unrepairing}}
						<span class="repairing active af-color"><i data-item_id="{{../item_data._id}}" class="fa fa-wrench"></i></span>
					{{/if}}		
					<span class="tags enabled"><i data-item_id="{{../item_data._id}}" class="fa fa-tags"></i></span>
				</p>
				{{/with}}			
			</div>
		{{/if}}
	</div>
</template>
