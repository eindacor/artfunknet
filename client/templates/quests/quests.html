<template name="quests">
	<div class="template-quests">
		{{#each quest}}
			{{> questTemplate this}}
		{{/each}}
	</div>
</template>

<template name="questTemplate">
	<div class="template-questTemplate">
		<div class="quest-container row">
			<div class="row">
				<p class="quest-title {{rarity}}">{{rarity}} quest</p>
				<div class="col-xs-12 col-md-8">
					<p class="details">find {{min_requirement}} of the following:</p>
					{{#each quest_target this}}
						{{#if acquired _id}}
							<p class="target-text highlight"><i class="fa fa-check-square-o green-text"></i> <span class="work-title">{{title}}</span> by {{artist}}</p>
						{{else}}
							<p class="target-text"><i class="fa fa-square-o"></i> <span class="work-title">{{title}}</span> by {{artist}} (<span class="{{artwork_rarity _id}}">{{artwork_rarity _id}}</span>)</p>
						{{/if}}
					{{/each}}
				</div>
				<div class="col-xs-12 col-md-4">
					<div class="reward-info">
						<p class="details">reward:</p>
						<p class="af-color">{{commaSeparatedValue reward.xp}}xp</p>
						<p class="af-color">{{displayAsMoneyValue reward.money}}</p>
						{{#if reward.item}}
							<p class="af-color">special {{#if reward.item.foil}}foil {{/if}}item</p>
						{{/if}}
					</div>
				</div>
			</div>
			{{#if _id}}
			<div class="row">
				<button data-quest_id="{{_id}}" class="quest-button turn-in-button {{#if hasCompleted _id}}enabled{{else}}disabled{{/if}}">claim reward</button>
				<button data-quest_id="{{_id}}" class="quest-button cancel-quest">cancel quest</button>
			</div>
			{{/if}}
		</div>
	</div>
</template>
