<template name="archiveAllModal">
	<div class="template-archiveAllModal col-xs-12">
		<div class="message-container">
			<div class="modal-message-area">
				<p class="modal-message">{{#if purchase}}Purchase and archive{{else}}Archive{{/if}} remaining unclaimed items?</p>
			</div>
			<div class="modal-button-area">
				<button class="modal-button" id="archive-all-confirm">confirm</button>
				<button class="modal-button close-button">cancel</button>
			</div>
		</div>
	</div>
</template>
