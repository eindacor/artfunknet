<template name="sellAllModal">
	<div class="template-sellAllModal col-xs-12">
		<div class="message-container">
			<div class="modal-message-area">
				<p class="modal-message">Sell remaining unclaimed items for {{displayAsMoneyValue this.sell_amount}}?</p>
			</div>
			<div class="modal-button-area">
				<button class="modal-button" id="sell-all-confirm">confirm</button>
				<button class="modal-button close-button">cancel</button>
			</div>
		</div>
	</div>
</template>
