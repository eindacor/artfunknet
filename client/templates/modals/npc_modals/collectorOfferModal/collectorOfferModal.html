<template name="collectorOfferModal">
	<div class="template-collectorOfferModal col-xs-12">
		<div class="message-container">
			<div class="modal-message-area">
				{{#with itemData interaction_object.offer_id}}
					{{>itemInfo item_data=this}}
					{{#if isEqual status "for_sale"}}
					<p class="modal-message">You have met an Art Collector, who understands you have recieved an offer to purchase <span class="highlight af-color">{{artwork_data.title}}</span> by <span class="highlight af-color">{{artwork_data.artist}}</span> from an Art Dealer. They would like to buy the piece, and have offered you <span class="highlight af-color">${{offerAmount ../interaction_object.offer_id}}</span> as a finder's fee. The estimated value of this item is <span class="highlight">${{getItemValue _id "actual"}}.</span></p>
					{{else}}
					<p class="modal-message">You have met an Art Collector who has been looking for one of the items in your permanent collection. They have offered you <span class="highlight af-color">${{offerAmount ../interaction_object.offer_id}}</span> for <span class="highlight af-color work-title">{{artwork_data.title}}</span> by <span class="highlight af-color">{{artwork_data.artist}}</span>. The estimated value of this item is <span class="highlight">${{getItemValue _id "actual"}}.</span></p>
					{{/if}}
				{{/with}}
			</div>
			<div class="modal-button-area">
				<button id="accept-button" data-offer_id="{{interaction_object.offer_id}}" class="modal-button">accept</button>
				<button id="decline-button" data-offer_id="{{interaction_object.offer_id}}" class="modal-button">decline</button>
			</div>
		</div>
	</div>
</template>
