<template name="tutorialMenuModal">
	<div class="template-tutorialMenuModal col-xs-12">
		<div class="message-container">	
			<div class="modal-message-area">
				<h4 class="highlight af-color">select a tutorial</h4>
				<div class="tutorial-section">
				{{#each fetchServerData "getTutorialNames"}}
					<p>{{#if has_completed this}}<i class="completed fa fa-check green-text"></i> {{/if}}<span data-tutorial_name="{{this}}" class="tutorial-item">{{this}}</span></p>
				{{/each}}
				</div>
			</div>
			<div class="modal-button-area">
				<button class="modal-button close-button">close</button>
			</div>
		</div>
	</div>
</template>
