<template name="donateAllModal">
	<div class="template-donateAllModal col-xs-12">
		<div class="message-container">
			<div class="modal-message-area">
				<p class="modal-message">{{#if purchase}}Purchase and donate{{else}}Donate{{/if}} remaining unclaimed items in exchange for knowledge?</p>
			</div>
			<div class="modal-button-area">
				<button class="modal-button" id="donate-all-confirm">confirm</button>
				<button class="modal-button close-button">cancel</button>
			</div>
		</div>
	</div>
</template>
