<template name="wiki">
	<div class="template-wiki container">
		<h1 class="af-color">Legendary Attributes</h1>
		<p class="black-text">Legendary and Masterpiece items have "special attributes", which can be identified by their pink glow. These attributes will never roll below an 80 by default. More importantly, pairs of special attributes give top-tier items "unique attributes," which provide special bonuses. The chart below shows the special attribute combinations and the unique attributes they provide.</p>
		<table id="legendary-attribute-matrix">
			<tr>
				<td></td>
				{{#each attribute}}
				<td>{{npc_name}}</td>
				{{/each}}
			</tr>
			{{#each attribute}}
			<tr class="legendary-row">
				<td>{{npc_name}}</td>
				{{#each intersection this}}
				{{#if is_null}}
				<td class="null"></td>
				{{else}}
				<td class="legendary-column">
					<p class="black-text highlight">{{title}}</p>
					<p class="af-color">"{{flavor_text}}"</p>
					<p>{{description}}</p>
				</td>
				{{/if}}
				{{/each}}
			</tr>
			{{/each}}
		</table>
	</div>
</template>
