<template name="adminTools">
	{{#if userIsAdmin}}
		{{#with adminData}}
		<div class="template-adminTools">
			<div class="container">
				<h1 class="af-color">Admin Tools</h1>
				<div class="row tools-section">
					<h4 class="af-color">Profile Modifier</h4>
					<div class="col-xs-12">
						{{> settable_field set_id="set_level" current=player_level button_id="level-set" label="player level"}}
						{{> settable_field set_id="set_xp" current=player_xp id="xp-set" label="xp"}}
						{{> settable_field set_id="set_daily_drop" current=daily_drop_count button_id="update-daily-drop-count" label="daily drop count"}}
						{{> settable_field set_id="set_crate_drop" current=crate_drop_count button_id="update-crate-drop-count" label="crate count"}}
						{{> settable_field set_id="set_bank_balance" current=bank_balance button_id="set-bank-balance" label="bank balance"}}
						{{> settable_field set_id="set_seasonal" current=seasonal_ids button_id="set-seasonal" label="seasonal items"}}
						{{> adminButton button_id="new-seasonals" button_label="new seasonals"}}
						{{> adminButton button_id="reset-daily" button_label="reset daily drop"}}
						{{> adminButton button_id="clear-unclaimed" button_label="clear unclaimed"}}
						{{> adminButton button_id="generate-for-sale" button_label="generate for-sale"}}
						{{> adminButton button_id="clear-for-sale" button_label="clear for-sale"}}
					</div>
				</div>

				<div class="row tools-section">
					<h4 class="af-color">Generate NPC</h4>
					<button id="generate-npc" class="set-button">generate npc</button>
					<select class="npc-selector">
						{{#each npc}}
						<option value="{{_id}}">{{npc_name}}</option>
						{{/each}}
					</select>
				</div>

				<div class="row artwork-mod tools-section">
					<h4 class="af-color">Modify Artwork</h4>
					<div data-artwork_id="{{selected_artwork._id}}" id="artwork-mod-container">	
						<div class="artwork-mod-info col-xs-6">	
							<select class="artwork-selector">
								<option value="">select artwork</option>
								{{#each artwork}}
									<option value="{{_id}}">{{artist}} - {{title}}</option>
								{{/each}}
							</select>
							<div class="artwork-mod-fields">
								<p>id: {{selected_artwork._id}}</p>
								{{> settable_field set_id="set_artwork_data" current=selected_artwork.title id="artwork-mod-title" label="title"}}
								{{> settable_field set_id="set_artwork_data" current=selected_artwork.date id="artwork-mod-date" label="date"}}
								{{> settable_field set_id="set_artwork_data" current=selected_artwork.genre id="artwork-mod-genre" label="genre"}}
								{{> settable_field set_id="set_artwork_data" current=selected_artwork.medium id="artwork-mod-medium" label="medium"}}
								{{> settable_field set_id="set_artwork_data" current=selected_artwork.value_scale id="artwork-mod-value-scale" label="value scale"}}
								{{> settable_field set_id="set_artwork_data" current=selected_artwork.height id="artwork-mod-height" label="height"}}
								{{> settable_field set_id="set_artwork_data" current=selected_artwork.width id="artwork-mod-width" label="width"}}
								{{> settable_field set_id="set_artwork_data" current=selected_artwork.filename id="artwork-mod-filename" label="filename"}}
								<p>active: 
									<select class="active-selector">
										{{#if selected_artwork.active}}
											<option value="true">true</option>
											<option value="false">false</option>
										{{else}}
											<option value="false">false</option>
											<option value="true">true</option>
										{{/if}}
									</select>
								</p>
								<p>nsfw: 
									<select class="nsfw-selector">
										{{#if selected_artwork.nsfw}}
											<option value="true">true</option>
											<option value="false">false</option>
										{{else}}
											<option value="false">false</option>
											<option value="true">true</option>
										{{/if}}
									</select>
								</p>
								<p>rarity: 
									<select class="rarity-selector">
										<option class="{{selected_artwork.rarity}}" value="{{selected_artwork.rarity}}">{{selected_artwork.rarity}}</option>
										{{#each rarity_choice selected_artwork.rarity}}
											<option class="{{this}}" value="{{this}}">{{this}}</option>
										{{/each}}
									</select>
								</p>
								<p>artist: 
									<select class="artwork-mod-artist-selector">
										<option value="{{selected_artwork.artist_id}}">{{selected_artwork.artist}}</option>
										{{#each artist_choice selected_artwork.artist_id}}
											<option value="{{_id}}">{{artist_name}}</option>
										{{/each}}
									</select>
								</p>
							</div>
						</div>
						<div class="artwork-mod-image col-xs-6">
							{{#with imageSize selected_artwork.width selected_artwork.height}}
							<img src="{{getImageURL selected_artwork.filename}}" width="{{image_width}}px" height="{{image_height}}px" />
							{{/with}}
						</div>
					</div>
				</div>

				<div class="row tools-section item-creation">
					<h4 class="af-color">Generate Item</h4>
					<select class="user-selector">
						<option value="{{current_id}}">{{current_user}}</option>
						{{#each user}}
							<option value="{{_id}}">{{profile.screen_name}}</option>
						{{/each}}
					</select>
					<p>artwork id: <input class="item-create-field" id="generate-artwork-id"></p>
					<p>condition: <input class="item-create-field" id="condition"></p>
					<p>xp rating: <input class="item-create-field" id="xp-rating"></p>
					<p>foil:
						<select class="foil-selector">
							<option value="false">false</option>
							<option value="true">true</option>
						</select>
					</p>
					<p>seasonal:
						<select class="seasonal-selector">
							<option value="false">false</option>
							<option value="true">true</option>
						</select>
					</p>
					<p>lottery:
						<select class="lottery-selector">
							<option value="0">0</option>
							<option value="1">1</option>
							<option value="2">2</option>
							<option value="3">3</option>
							<option value="4">4</option>
							<option value="5">5</option>
							<option value="6">6</option>
							<option value="7">7</option>
							<option value="8">8</option>
							<option value="9">9</option>
							<option value="10">10</option>
						</select>
					</p>
					<p><button id="generate-item">generate item</button></p>
				</div>

				<div class="row tools-section random-item-creation">
					<h4 class="af-color">Generate Randomized Item</h4>
					<select class="user-selector-random">
						<option value="{{current_id}}">{{current_user}}</option>
						{{#each user}}
							<option value="{{_id}}">{{profile.screen_name}}</option>
						{{/each}}
					</select>
					<p>artwork id: <input class="random-item-create-field" id="random-artwork-id"></p>
					<p><button id="generate-random-item">randomize item</button></p>
				</div>

				<!-- <div class="row tools-section profile-modification">
					<h4 class="af-color">Profile Modification</h4>
					<p>field to modify: <input class="profile-mod-field" id="profile-add-field"></p>
					<p>value: <input class="profile-mod-field" id="profile-add-value"></p>
					<p><button id="modify-profiles">modify profiles</button></p>
				</div> -->

				<div class="row tools-section alert-users-area">
					<h4 class="af-color">Alert All Users</h4>
					<textarea class="admin-textarea" id="alert-users-text"></textarea>
					<p><button id="alert-users">submit</button></p>
				</div>

				<div class="row tools-section attributes-area">
					<div class="col-xs-4">
						<h4 class="af-color">Active Attributes</h4>
						{{#each attribute}}
						<p class="attribute-toggle" data-attribute_id="{{_id}}">{{#if active}}<i class="green-text fa fa-check-square-o"></i>{{else}}<i class="fa fa-square-o"></i>{{/if}} {{title}}</p>
						{{/each}}
					</div>
				</div>

				<div class="row tools-section database-area">
					<h4 class="af-color">Download Databases</h4>
					<p><button id="generate-link">generate link</button></p>
					<div id="download-area"></div>
				</div>

				<div class="row tools-section legendary-attributes">
					<h4 class="af-color">Set Legendary Attributes</h4>
					{{#each legendary_found}}
					<div class="row">
						<div data-artwork_id="{{_id}}" class="col-xs-6 legendary-container">
							<p class="{{rarity}}">{{title}} by {{artist}}</p>
							{{#each locked_attributes}}
							<select class="attribute-selector">
								<option value="{{this}}">{{npcName this}}</option>
								{{#each selectorChoice ../locked_attributes}}
									<option value="{{_id}}">{{npc_name}}</option>
								{{/each}}
							</select>
							{{/each}}
						</div>
					</div>
					{{/each}}
				</div>

			</div>
		</div>
		{{/with}}
	{{/if}}
</template>

<template name="settable_field">
	<div class="row">
		<div data-set_id="{{set_id}}" class="set-container col-xs-6 no-padding">
			<div class="row">
				<div class="col-xs-4">
					<p>{{label}}: </p>
				</div>
				<div class="col-xs-8">
					<!-- <p id="{{id}}" class="text-field">{{current}}</p> -->
					<input id="{{id}}" class="set-field" value="{{current}}">
				</div>		
			</div>
		</div>
	</div>
</template>

<template name="adminButton">
	<div class="row">
		<button id="{{button_id}}" class="set-button">{{button_label}}</button>
	</div>
</template>
