<template name="navbar">
	<div class="template-navbar col-xs-12 no-padding pull-right">
		<div class="container no-padding no-margin">
			<div class="col-sm-4 col-xs-12 no-padding navbar-section">
				<dev class="row icon-row">
					<dev class="col-xs-1 icon-section">
						<a href="/"><i data-title="Home" class="{{#if hasAlerts}}blue-text{{/if}} nav-icon fa fa-home"></i></a>
					</dev>
						{{#if currentUser}}
							<dev class="col-xs-1  icon-section">
								<a href="/auctions"><i data-title="Auction House" class="nav-icon fa fa-gavel"></i></a>
							</dev>
							<dev class="col-xs-1  icon-section">
								<a href="/loot"><i data-title="Loot Section" class="{{#if hasLoot}}yellow-text{{/if}} nav-icon fa fa-gift"></i>
									{{#with notifications}}
										{{#each loot}}
										<span class="notification gold-text">+{{amount}}</span>
										{{/each}}
									{{/with}}
								</a>
								
							</dev>
							<dev class="col-xs-1  icon-section">
								<a href="/store"><i data-title="Store" class="{{#if hasForSale}}green-text{{/if}} nav-icon fa fa-money"></i>
									{{#with notifications}}
										{{#each store}}
										<span class="notification green-text">+{{amount}}</span>
										{{/each}}
									{{/with}}
								</a>
							</dev>
							<dev class="col-xs-1  icon-section">
								<a href="/galleries"><i data-title="Player Galleries" class="nav-icon fa fa-globe"></i></a>
							</dev>
							<dev class="col-xs-1  icon-section">
								<a href="/user/{{screen_name}}"><i data-title="My Gallery" class="{{#if hasVisitors}}af-color{{/if}} nav-icon fa fa-picture-o"></i></a>
							</dev>
							<dev class="col-xs-1  icon-section">
								<a href="/checklist"><i data-title="Checklist" class="nav-icon fa fa-list"></i></a>
							</dev>
							<dev class="col-xs-1  icon-section">
								<a href="/leaderboard"><i data-title="Leaderboard" class="nav-icon fa fa-trophy"></i></a>
							</dev>
							{{#if hasQuest}}
							<dev class="col-xs-1  icon-section">					
								<a href="/quests"><i data-title="Quests" class="{{#if hasFullyCompletedQuest}}orange-text{{else}}{{#if hasCompletedQuest}}bright-orange-text{{/if}}{{/if}} nav-icon fa fa-flag-checkered"></i></a>
							</dev>
							{{/if}}
					   	{{/if}} 
					   	<dev class="col-xs-1  icon-section">	
					    	<a href="/help"><i data-title="Help" class="nav-icon fa fa-question"></i></a>
					    </dev>
					    <dev class="col-xs-1  icon-section">
					    	<a href="/wiki"><i data-title="Legendary Attributes" class="nav-icon fa fa-star"></i></a>
					    </dev>
					    {{#if currentUser}}
					    <!-- <dev class="col-xs-1  icon-section">
					    	<a href="/logout"><i data-title="Log Out" class="logout-button nav-icon fa fa-sign-out light-gray"></i></a>
					    </dev> -->
					    {{/if}}	
					    {{#if userIsAdmin}}
					    <dev class="col-xs-1  icon-section">
							<a href="/admin"><i data-title="Admin Tools" class="nav-icon fa fa-cog light-gray"></i></a>
						</dev>
						{{/if}}
				</dev>
			</div>

		    {{#if currentUser}}
	    	<div class="col-sm-4 col-xs-12 no-padding navbar-section">
				{{#each ticket}}
					{{#with ticketData this}}
					<a href="/user/{{owner_name}}" class="ticket-button {{#if unmet_npcs}}af-color{{else}}npcs-met{{/if}}"><i data-expiration_string="{{expiration_string}}" data-owner_name="{{owner_name}}" class="fa fa-ticket"></i></a>
					{{/with}}
				{{/each}}
			</div>
			{{/if}}
			{{#if currentUser}}			
		    	<div class="col-sm-4 col-xs-12 no-padding navbar-section">
		    		<div class="row">
		    			{{#with notifications}}
			    			<div class="notification-area col-xs-2 xp">
				    		{{#each xp}}
								<span class="notification af-color">{{commaSeparatedValue amount}}xp</span>
							{{/each}}
							</div>
							<div class="notification-area col-xs-2 money">
							{{#each money}}
								<span class="notification {{#if isNegative amount}}red-text{{else}}green-text{{/if}}">{{displayAsMoneyValue amount}}</span>
							{{/each}}
							</div>
							<div class="notification-area col-xs-8">
							{{#each procs}}
								<div class="notification af-color">
									<p>{{title}}</p>
									<p><span class="black-text" style="font-size: 1.2rem">{{artist}}</span></p>
									<!-- <p>{{code}}</p> -->
								</div>	
							{{/each}}
							</div>
						{{/with}}
					</div>
				</div>			
			{{/if}}
        </div>
    </div>
</template>
