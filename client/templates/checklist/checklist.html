<template name="checklist">
	<div class="template-checklist">
		<div class="rarity-tabs row">
		{{#each rarity}}
			<div class="rarity-tab {{#if selected this}}selected{{/if}} col-xs-2 {{this}}" data-rarity="{{this}}">{{this}}</div>
		{{/each}}
			<div class="blank-tab col-xs-2" data-rarity="{{this}}"> </div>
		</div>
		<div class="artwork-area row">
			<div class="row">
				<div class="page-buttons button-wrapper">
					<i id="auctions-page-left" class="page-button fa fa-caret-left"></i>
					<span class="page-indicators">page {{#with page_info}}{{current_page}}/{{total_pages}}{{/with}}</span>
					<i id="auctions-page-right" class="page-button fa fa-caret-right"></i>	
				</div>
			</div>
			{{#with checklist_counts}}
			<div class="row category-headers">
				<div class="category-column col-xs-4">
					<p class="category-header">artwork</p>
					<p class="counts">({{total}})</p>
				</div>
				{{> countHeader name="owned" count_object=owned}}
				{{> countHeader name="seen" count_object=seen}}
				{{> countHeader name="displayed" count_object=displayed}}
			</div>
			{{/with}}
			{{#each artwork}}
			<div class="row category-row" data-artwork_id="{{_id}}">
				<div class="artwork-info col-xs-4 no-padding">{{artist}} - {{title}}</div>
				{{#each category}}
					<div class="category-column col-xs-2">
						{{#with fulfilled ../_id this}}
						{{#if this}}<i class="check black-text fa fa-check "></i>
							{{#if foil}}<i class="check af-color fa fa-check"></i>{{/if}}
							{{#if seasonal}}<i class="check green-text fa fa-check"></i>{{/if}}
							{{#if lottery}}<i class="check gold-text fa fa-check "></i>{{/if}}
							{{#if original}}<i class="check purple-text fa fa-check"></i>{{/if}}
						{{/if}}
						{{/with}}
					</div>
				{{/each}}	
			</div>
			{{/each}}
		</div>
		<div class="legend">
			<p><i class="check fa fa-check "></i> - standard</p>
			<p><i class="check af-color fa fa-check"></i> - foil</p>
			<p><i class="check green-text fa fa-check"></i> - seasonal</p>
			<p><i class="check gold-text fa fa-check "></i> - lottery</p>
			<p><i class="check purple-text fa fa-check"></i> - original</p>
		</div>
	</div>
</template>

<template name="countHeader">
	<div class="category-column headers col-xs-2">
		<p class="category-header">{{name}}</p> 
		<p class="counts">({{count_object.standard}}|<span class="af-color">{{count_object.foil}}</span>|<span class="green-text">{{count_object.seasonal}}</span>|<span class="gold-text">{{count_object.lottery}}</span>|<span class="purple-text">{{count_object.original}}</span>)
		</p>
	</div>
</template>
