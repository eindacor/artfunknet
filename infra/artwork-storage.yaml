AWSTemplateFormatVersion: "2010-09-09"
Description: Private Artfunkel artwork storage with CloudFront delivery

Resources:
  ArtworkBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ArtworkOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: CloudFront access to private Artfunkel artwork
        Name: !Sub "${AWS::StackName}-artwork-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ArtworkDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - DomainName: !GetAtt ArtworkBucket.RegionalDomainName
            Id: artwork-s3-origin
            OriginAccessControlId: !GetAtt ArtworkOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: artwork-s3-origin
          ViewerProtocolPolicy: redirect-to-https

  ArtworkBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtworkBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ArtworkBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
                  - DistributionId: !Ref ArtworkDistribution

Outputs:
  ArtworkBucketName:
    Description: Set this as ARTWORK_S3_BUCKET
    Value: !Ref ArtworkBucket

  ArtworkCdnBaseUrl:
    Description: Set this as ARTWORK_CDN_BASE_URL
    Value: !Sub "https://${ArtworkDistribution.DomainName}"
